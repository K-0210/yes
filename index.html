<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

   <style>
        #unselected{
            color: #e5e5e5;
        }
        body{
            background-color: #0C2C55;
        }
        .card{
            background-color: #EDEDCE;
            border-radius: 25px;
            border-color: #b0b093;
            max-width: 400px;
            width: 100%;
            margin: auto;
        }
        h2{
            color: black;
        }
        .btn-pink{
            background-color: #629FAD;
            color: white;
            border-radius: 20px;
            border-color: #296374;
        }
        #calc{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #result{
            margin-top: 15px;
            font-weight: 600px;
            background-color: #629FAD;
            border-radius: 50px;
            color: white;
            border: 1px solid #296374;
        } 
        img{
            display: block;
            margin: 20px auto;
        }
        
    </style>

</head>
<body>
    
    <div class="container" id="calc">

        <div class="d-flex justify-content-center w-100">
                
            <div class="card p-3 p-md-4 shadow">
                    
    <h2 class="text-center fw-bold text-nowrap">Log In!</h2>
                    

    <img src="Circle-icons-profile.svg.png" class="img-fluid d-block mx-auto my-3" style="max-width: 150px;">
    
    <form class="text-center mb-3">

    <div class="mb-3 text-start">
        <label class="form-label">Username:</label>
        <input type="text" id="uname" class="form-control" placeholder="Enter username" required>
    </div>

    <div class="mb-3 text-start">
        <label class="form-label">Password:</label>
        <input type="password" id="pass" class="form-control" placeholder="Enter password" required>
    </div>

    <div class="form-check mb-3 text-start">
        <input type="checkbox" class="form-check-input" id="chicken">
        <label class="form-check-label" for="chicken">Stay logged in?</label>
    </div>

    <button type="button" class="btn btn-pink w-100 fw-bold mb-3" onclick="authenticate()">Log In</button>

    </form>

            </div>

        </div>
    
    </div>

<script>
    function authenticate(){
        var sapphire1 = document.getElementById("uname").value;
        var sapphire2 = document.getElementById("pass").value;

            if (sapphire1 === "K-0210" && sapphire2 === "20201120") {
                alert("Welcome " + sapphire1 + " !");
                window.location.href = "smth.html";
            }
            else {
                alert("Incorrect username/password");
            }

    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
